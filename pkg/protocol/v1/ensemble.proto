syntax = "proto3";
package ensemble.v1;

option go_package = "pkg/ensemble/v1";

message Parameter {
  string id = 1;
  string type = 2; // numeric, string, boolean, constant
  float min_value = 3;
  float max_value = 4;
  float step = 5;
  string structure = 6;
}

message Job {
  string project_id = 1;
  uint64 job_id = 2;
  map<string, string> values = 3;
}

message JobRequest {
  string worker_id = 1;
  uint32 capacity = 2;
}